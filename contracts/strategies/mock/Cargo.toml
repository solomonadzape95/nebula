[package]
name = "nebula-strategy-mock"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[features]
# Exposes the controls that make this strategy misbehave on demand. Off by default so they cannot
# reach a deployable wasm; the vault's dev-dependency turns it on for the test suite.
testutils = []

[dependencies]
soroban-sdk = { workspace = true }
nebula-interfaces = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
