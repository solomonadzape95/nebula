<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <!-- Favicon build of the Nebula mark. The body is solid signal green and the halftone is
       printed onto it in the page ground, so the colour reads true at any size. A finer lattice
       than the on-page version: at browser-tab size a coarse grid closes the voids up. -->
  <defs>
    <mask id="voids">
      <circle cx="20" cy="20" r="18.5" fill="white" />
      <circle cx="25.5" cy="13" r="7.2" fill="black" />
      <circle cx="13" cy="26.5" r="4.6" fill="black" />
      <circle cx="27" cy="28.5" r="2.6" fill="black" />
    </mask>
    <pattern id="dots" width="1.5" height="1.5" patternUnits="userSpaceOnUse">
      <rect width="1.5" height="1.5" fill="black" />
      <circle cx="0.75" cy="0.75" r="0.48" fill="white" />
    </pattern>
    <mask id="lattice">
      <rect width="40" height="40" fill="url(#dots)" />
    </mask>
  </defs>
  <g mask="url(#voids)">
    <rect width="40" height="40" fill="#86f2c0" />
    <rect width="40" height="40" fill="#07080a" mask="url(#lattice)" opacity="0.82" />
  </g>
</svg>
