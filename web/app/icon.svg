<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <!-- Favicon build of the Nebula mark. A 1px lattice keeps a hint of the halftone at 32px;
       anything coarser closes the ring up into a blob at browser-tab size. -->
  <defs>
    <pattern id="dots" width="1.4" height="1.4" patternUnits="userSpaceOnUse">
      <rect width="1.4" height="1.4" fill="black" />
      <circle cx="0.7" cy="0.7" r="0.45" fill="white" />
    </pattern>
    <mask id="halftone">
      <rect width="40" height="40" fill="url(#dots)" />
    </mask>
  </defs>
  <g mask="url(#halftone)" fill="#86f2c0" stroke="#86f2c0">
    <circle cx="16.5" cy="23" r="12.5" fill="none" stroke-width="3.2" />
    <circle cx="29.5" cy="11.5" r="7.4" stroke="none" />
    <circle cx="7.5" cy="7.5" r="3.4" stroke="none" />
  </g>
</svg>
